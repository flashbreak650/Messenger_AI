<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messenger AI Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    .container {
      width: min(1000px, 92%);
      margin: 50px auto;
    }

    .header, .card {
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,.05);
    }

    .header {
      padding: 28px;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .header p, .info {
      color: #697386;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .card { padding: 25px; }

    .card h3 { margin-bottom: 12px; }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #999;
    }

    .dot.online { background: #16a34a; }
    .dot.offline { background: #dc2626; }

    .info {
      margin-top: 10px;
      font-size: 14px;
    }

    .endpoint {
      margin-top: 25px;
      background: #101828;
      color: #d1fae5;
      padding: 18px;
      border-radius: 14px;
      overflow-x: auto;
      font-family: monospace;
    }

    @media (max-width: 700px) {
      .grid { grid-template-columns: 1fr; }
      .container { margin: 20px auto; }
    }
  </style>
</head>

<body>
  <main class="container">
    <section class="header">
      <h1>🤖 Messenger AI Assistant</h1>
      <p>Facebook Messenger-এর জন্য AI customer support dashboard</p>
    </section>

    <section class="grid">
      <div class="card">
        <h3>Server</h3>
        <div class="status">
          <span id="serverDot" class="dot"></span>
          <span id="serverStatus">Checking...</span>
        </div>
        <div class="info">Backend health status</div>
      </div>

      <div class="card">
        <h3>Webhook</h3>
        <div class="status">
          <span id="webhookDot" class="dot"></span>
          <span id="webhookStatus">Checking...</span>
        </div>
        <div class="info">/webhook endpoint</div>
      </div>

      <div class="card">
        <h3>AI Assistant</h3>
        <div class="status">
          <span class="dot online"></span>
          <span>Configured</span>
        </div>
        <div class="info">Bengali AI response system</div>
      </div>
    </section>

    <section class="card" style="margin-top:20px">
      <h3>Webhook URL</h3>
      <div class="endpoint" id="webhookUrl">Loading...</div>
    </section>
  </main>

  <script>
    async function checkHealth() {
      const serverDot = document.getElementById("serverDot");
      const serverStatus = document.getElementById("serverStatus");
      const webhookDot = document.getElementById("webhookDot");
      const webhookStatus = document.getElementById("webhookStatus");

      try {
        const response = await fetch("/health");

        if (!response.ok) {
          throw new Error("Server unavailable");
        }

        const data = await response.json();

        if (data.status !== "ok") {
          throw new Error("Invalid health response");
        }

        serverDot.className = "dot online";
        serverStatus.textContent = "Online";
        webhookDot.className = "dot online";
        webhookStatus.textContent = "Ready";
      } catch {
        serverDot.className = "dot offline";
        serverStatus.textContent = "Offline";
        webhookDot.className = "dot offline";
        webhookStatus.textContent = "Unavailable";
      }

      document.getElementById("webhookUrl").textContent =
        window.location.origin + "/webhook";
    }

    checkHealth();
    setInterval(checkHealth, 30000);
  </script>
</body>
</html>
